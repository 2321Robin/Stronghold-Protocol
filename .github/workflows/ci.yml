name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }}, shard ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    # One shard is a quarter of the suite (ci-shards.json balances them by measured time), so a job is the slowest
    # shard on the slowest runner: measured 2074 s of test work per shard, ~10 minutes of wall clock with the runner's
    # parallelism, against the 19.7 min (ubuntu) / 22.4 min (windows) the single full run took in run 38777566530.
    # 20 minutes keeps a margin and still fails a hung job long before the old 40.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 22 and 24 = the maintained LTS lines (24 is what `winget install OpenJS.NodeJS.LTS` installs today)
        node: [22, 24]
        # the shards of ci-shards.json: together they are exactly the full `npm test`, apart they are four shorter jobs
        shard: [0, 1, 2, 3]
    env:
      # Browser/E2E suites gate themselves on these (and on a local Chrome + downloaded game assets, which CI never
      # has): keep them off explicitly. Suites that need .cache/gamedata, public/assets or data/local-assets.json skip.
      SP_E2E: '0'
      SP_REAL_E2E: '0'
      RENDER_E2E: '0'
      NO_COLOR: '1'
      # tools/test-run.mjs runs this shard's files: `npm run test` stays the whole suite everywhere else
      SHARD: ${{ matrix.shard }}
      # …and leaves a JUnit report, the only output that says which file each time belongs to (tools/test-timings.mjs)
      JUNIT: junit-${{ matrix.os }}-${{ matrix.node }}-${{ matrix.shard }}.xml
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install (npm ci → postinstall copies public/vendor)
        run: npm ci --no-audit --no-fund

      - name: Setup check (no downloads)
        run: node tools/setup.mjs --check --no-local

      # package.json "test": node tools/test-run.mjs over the test files of this job's SHARD (the whole suite when
      # SHARD is unset). A bare `node --test` would also run every helper and fixture under test/.
      - name: Unit & integration tests
        run: npm run test

      # The per-file times the shard table is re-weighed from: a job log has the test names but not the files they
      # belong to, and a JUnit report has both (`node tools/test-timings.mjs <report.xml> …`).
      - name: Test timings (JUnit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}-${{ matrix.node }}-${{ matrix.shard }}
          path: junit-*.xml
          retention-days: 7
          if-no-files-found: warn

      - name: Server smoke test (boot, /healthz, index.html, doctor)
        shell: bash
        run: |
          node server/index.js > server.log 2>&1 &
          pid=$!
          ok=
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/healthz; then ok=1; break; fi
            sleep 1
          done
          echo
          [ -n "$ok" ] || { cat server.log; exit 1; }
          # Save the page first: piping curl into `grep -q` let grep exit on the first match, curl then failed with a
          # write error (23) and pipefail turned that into a flaky red step.
          curl -fsS -o index.out http://127.0.0.1:3000/
          grep -qi '<html' index.out
          curl -fsS -o /dev/null http://127.0.0.1:3000/vendor/pixi.min.js
          node tools/doctor.mjs || true
          kill $pid || true

  # Separate from the test matrix so lint / types / import boundaries run once, not four times.
  # Lint warnings do not fail the job (npm run lint does not pass --max-warnings=0).
  tooling:
    name: tooling (lint, imports, typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install (npm ci → postinstall copies public/vendor)
        run: npm ci --no-audit --no-fund

      - name: Lint (warnings allowed)
        run: npm run lint

      - name: Import boundaries
        run: npm run check:imports

      - name: Typecheck
        run: npm run typecheck
